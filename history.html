<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="browser-192.png" type="image/png">

    <link rel="manifest" href="browser-manifest.json">
    <meta name="theme-color" content="#f3b407">
    <link rel="apple-touch-icon" href="browser-192.png">

    <title>History - Browser</title>

    <meta name="color-scheme" content="light dark">

    <script src="theme.js"></script>
    <link rel="stylesheet" href="pages.css">

    <style>
        .header-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            gap: 12px;
            position: relative;
            min-height: 40px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin: 0;
            flex-shrink: 0;
            max-width: 200px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                max-width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                margin 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                padding 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .clear-all-text-btn {
            background: rgba(255, 71, 87, 0.1);
            color: var(--danger-color);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            min-height: 40px;
            flex-shrink: 0;
            width: 110px;
            transition: background 0.2s ease,
                transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .clear-all-text-btn:hover {
            background: rgba(255, 71, 87, 0.2);
        }

        .hide-element {
            opacity: 0 !important;
            transform: scale(0.6) !important;
            pointer-events: none;
        }

        .history-search-box {
            display: flex;
            align-items: center;
            background: rgba(150, 150, 150, 0.1);
            border-radius: 20px;
            height: 40px;
            position: absolute;
            top: 0;
            right: 122px;
            width: 40px;
            z-index: 10;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                right 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                background 0.3s ease,
                box-shadow 0.3s;
            overflow: hidden;
            cursor: pointer;
        }

        .history-search-box.expanded {
            right: 0 !important;
            width: 100% !important;
            box-shadow: inset 0 0 0 1px var(--border-color);
            background: transparent;
            cursor: text;
        }

        .history-search-box:not(.expanded):hover {
            background: rgba(150, 150, 150, 0.18);
        }

        .search-icon {
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            position: absolute;
            left: 11px;
            transition: color 0.3s;
            pointer-events: none;
            flex-shrink: 0;
        }

        .history-search-box.expanded .search-icon {
            color: var(--text-color);
        }

        #historySearchInput {
            border: none;
            background: transparent;
            color: var(--text-color);
            font-size: 15px;
            font-family: inherit;
            width: 100%;
            height: 100%;
            padding-left: 38px;
            padding-right: 32px;
            outline: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .history-search-box.expanded #historySearchInput {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.3s ease 0.1s;
        }

        #historySearchInput::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .clear-search-btn {
            position: absolute;
            right: 4px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            transition: opacity 0.2s, transform 0.2s, background 0.2s;
        }

        .clear-search-btn svg {
            width: 16px;
            height: 16px;
        }

        .clear-search-btn.show {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .clear-search-btn:hover {
            background: rgba(150, 150, 150, 0.2);
            color: var(--text-color);
        }

        .history-list {
            display: flex;
            flex-direction: column;
        }

        .history-group + .history-group {
            margin-top: 16px;
        }

        .history-date-header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 16px;
            background: rgba(150, 150, 150, 0.08);
            border-radius: 8px;
            margin: 4px 0 8px 0;
        }

        .date-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .history-list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            margin: 0;
            border-radius: 12px;
            position: relative;
            transition: background 0.15s ease;
            cursor: pointer;
        }

        .history-list-item:hover {
            background: var(--hover-bg);
        }

        .history-time {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .history-icon-wrapper {
            width: 36px;
            height: 36px;
            background: rgba(150, 150, 150, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .history-content {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
        }

        .history-text-group {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .history-query {
            font-size: 15px;
            color: var(--text-color);
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-subtext {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-separator {
            margin: 0 4px;
            opacity: 0.5;
        }

        .history-delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.15s ease, background 0.15s;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .history-delete-btn:hover {
            color: var(--danger-color);
            background: rgba(255, 71, 87, 0.1);
        }

        .history-delete-btn:active {
            background: rgba(255, 71, 87, 0.2);
        }

        html.dark-mode .history-delete-btn:hover {
            background: rgba(255, 71, 87, 0.15);
        }

        .no-results-msg {
            text-align: center;
            padding: 40px 20px;
            margin: 0;
            color: var(--text-muted);
            font-size: 15px;
        }

        dialog.modal-card {
            background: var(--card-bg);
            color: var(--text-color);
            border: none;
            border-radius: 16px;
            width: calc(100% - 40px);
            max-width: 340px;
            padding: 0;
            box-shadow: 0 10px 40px var(--shadow-color);
        }

        dialog.modal-card::backdrop {
            background: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            padding: 30px 24px 24px;
            text-align: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-color);
            margin: 0 0 10px 0;
        }

        .modal-text {
            font-size: 15px;
            color: var(--text-muted);
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .modal-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .modal-btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: background 0.15s, box-shadow 0.15s;
            flex: 1;
        }

        .modal-btn-cancel {
            background: rgba(150, 150, 150, 0.1);
            color: var(--text-color);
        }

        .modal-btn-cancel:hover {
            background: rgba(150, 150, 150, 0.2);
        }

        .modal-btn-delete {
            background: rgba(255, 71, 87, 0.1);
            color: var(--danger-color);
        }

        .modal-btn-delete:hover {
            background: rgba(255, 71, 87, 0.2);
        }
    </style>
</head>

<body>
    <main class="container">
        <header class="hero-card">
            <div class="close-btn-wrapper">
                <a href="index.html" class="close-btn" aria-label="Close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </a>
            </div>
            <div class="hero-content">
                <h1 class="hero-title">Browsing History</h1>
                <p class="hero-subtitle">View and manage your recent searches</p>
            </div>
        </header>

        <section class="content-card">
            <div class="header-actions">
                <h2 class="section-title">All History</h2>
                <div class="history-search-box" id="historySearchBox" tabindex="0" aria-label="Search history">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="historySearchInput" placeholder="Search..." aria-label="Search history"
                        autocomplete="off">
                    <button type="button" class="clear-search-btn" id="clearSearchBtn" aria-label="Clear search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <button type="button" id="clearAllHistoryBtn" class="clear-all-text-btn">Delete All</button>
            </div>

            <div id="historyList" class="history-list"></div>
            <p id="emptyHistoryMsg" class="no-results-msg" hidden>No browsing history found.</p>
            <p id="noResultsMsg" class="no-results-msg" hidden></p>
        </section>
    </main>

    <dialog id="confirmModal" class="modal-card" aria-labelledby="confirmModalTitle">
        <div class="modal-content">
            <h3 class="modal-title" id="confirmModalTitle">Clear History</h3>
            <p class="modal-text">Are you sure you want to clear your entire browsing history?</p>
            <div class="modal-actions">
                <button type="button" id="confirmModalCancel" class="modal-btn modal-btn-cancel">Cancel</button>
                <button type="button" id="confirmModalDelete" class="modal-btn modal-btn-delete">Delete All</button>
            </div>
        </div>
    </dialog>

    <script src="engines.js"></script>
    <script src="utils.js"></script>
    <script>
        const ICONS = {
            link: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>',
            search: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>',
            close: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>'
        };

        const historyList = document.getElementById('historyList');
        const emptyHistoryMsg = document.getElementById('emptyHistoryMsg');
        const noResultsMsg = document.getElementById('noResultsMsg');
        const clearAllBtn = document.getElementById('clearAllHistoryBtn');
        const searchBox = document.getElementById('historySearchBox');
        const searchInput = document.getElementById('historySearchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const sectionTitle = document.querySelector('.section-title');
        const confirmModal = document.getElementById('confirmModal');
        const confirmModalCancel = document.getElementById('confirmModalCancel');
        const confirmModalDelete = document.getElementById('confirmModalDelete');

        const fullDateFormatter = new Intl.DateTimeFormat(undefined, {
            weekday: 'long',
            day: 'numeric',
            month: 'long',
            year: 'numeric'
        });

        const timeFormatter = new Intl.DateTimeFormat(undefined, {
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
        });

        function setSearchExpanded(expanded) {
            searchBox.classList.toggle('expanded', expanded);
            searchBox.tabIndex = expanded ? -1 : 0;
            sectionTitle.classList.toggle('hide-element', expanded);
            clearAllBtn.classList.toggle('hide-element', expanded);
            if (!expanded) clearSearchBtn.classList.remove('show');
        }

        function resetSearch() {
            searchInput.value = '';
            setSearchExpanded(false);
        }

        function getDateLabel(timestamp, todayKey, yesterdayKey) {
            const date = new Date(timestamp);
            if (!timestamp || Number.isNaN(date.getTime())) return 'Older Searches';

            const fullDate = fullDateFormatter.format(date);
            const dayKey = date.toDateString();

            if (dayKey === todayKey) return `Today - ${fullDate}`;
            if (dayKey === yesterdayKey) return `Yesterday - ${fullDate}`;
            return fullDate;
        }

        function getTimeLabel(timestamp) {
            const date = new Date(timestamp);
            if (!timestamp || Number.isNaN(date.getTime())) return '--:--';
            return timeFormatter.format(date);
        }

        function groupHistoryByDate(history) {
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);

            const groups = new Map();
            history.forEach((item) => {
                const label = getDateLabel(item.time, today.toDateString(), yesterday.toDateString());
                if (!groups.has(label)) groups.set(label, []);
                groups.get(label).push(item);
            });
            return groups;
        }

        function buildEntryHTML(item) {
            const engine = getEngineById(item.engine);
            const isUrl = isLikelyUrl(item.query);
            const url = buildUrl(item.query, engine) || '#';
            const subtext = isUrl ? url : `${engine.name} Search`;
            const timeLabel = getTimeLabel(item.time);

            return `
                <div class="history-list-item" role="link" tabindex="0" data-url="${escapeHTML(url)}" data-query="${escapeHTML(item.query)}">
                    <div class="history-content">
                        <div class="history-icon-wrapper">${isUrl ? ICONS.link : ICONS.search}</div>
                        <div class="history-text-group">
                            <div class="history-query" title="${escapeHTML(item.query)}">${escapeHTML(item.query)}</div>
                            <div class="history-subtext" title="${escapeHTML(timeLabel)} • ${escapeHTML(subtext)}">
                                <span class="history-time">${escapeHTML(timeLabel)}</span>
                                <span class="history-separator">•</span>
                                <span>${escapeHTML(subtext)}</span>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="history-delete-btn" data-id="${escapeHTML(item.id)}" aria-label="Delete item" title="Remove from history">${ICONS.close}</button>
                </div>`;
        }

        function filterHistory(searchQuery) {
            const needle = searchQuery.trim().toLowerCase();
            let hasVisibleItems = false;

            historyList.querySelectorAll('.history-group').forEach((group) => {
                let groupHasVisibleItem = false;

                group.querySelectorAll('.history-list-item').forEach((row) => {
                    const matches = !needle
                        || row.dataset.query.toLowerCase().includes(needle)
                        || row.dataset.url.toLowerCase().includes(needle);
                    row.hidden = !matches;
                    if (matches) groupHasVisibleItem = true;
                });

                group.hidden = !groupHasVisibleItem;
                if (groupHasVisibleItem) hasVisibleItems = true;
            });

            const showNoResults = Boolean(needle) && !hasVisibleItems && historyList.children.length > 0;
            noResultsMsg.hidden = !showNoResults;
            if (showNoResults) {
                noResultsMsg.innerHTML = `No results found for "<b>${escapeHTML(needle)}</b>"`;
            }
        }

        function renderHistoryView() {
            const history = getSearchHistory();
            const hasHistory = history.length > 0;

            emptyHistoryMsg.hidden = hasHistory;
            clearAllBtn.hidden = !hasHistory;
            searchBox.hidden = !hasHistory;

            if (!hasHistory) {
                historyList.innerHTML = '';
                noResultsMsg.hidden = true;
                resetSearch();
                return;
            }

            historyList.innerHTML = Array.from(groupHistoryByDate(history), ([label, items]) => `
                <div class="history-group">
                    <div class="history-date-header"><span class="date-label">${escapeHTML(label)}</span></div>
                    ${items.map(buildEntryHTML).join('')}
                </div>`).join('');

            filterHistory(searchInput.value);
        }

        function openEntry(row, inNewTab) {
            const url = row.dataset.url;
            if (!url || url === '#') return;

            if (inNewTab) {
                window.open(url, '_blank', 'noopener');
            } else {
                window.location.href = url;
            }
        }

        searchBox.addEventListener('click', () => {
            if (searchBox.classList.contains('expanded')) return;
            setSearchExpanded(true);
            searchInput.focus();
        });

        searchBox.addEventListener('keydown', (event) => {
            if (event.target !== searchBox) return;
            if (event.key !== 'Enter' && event.key !== ' ') return;
            event.preventDefault();
            setSearchExpanded(true);
            searchInput.focus();
        });

        document.addEventListener('click', (event) => {
            if (searchBox.contains(event.target)) return;
            if (searchInput.value.trim() !== '') return;
            setSearchExpanded(false);
        });

        searchInput.addEventListener('input', () => {
            clearSearchBtn.classList.toggle('show', searchInput.value.trim().length > 0);
            filterHistory(searchInput.value);
        });

        clearSearchBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            searchInput.value = '';
            clearSearchBtn.classList.remove('show');
            filterHistory('');
            searchInput.focus();
        });

        historyList.addEventListener('click', (event) => {
            const deleteBtn = event.target.closest('.history-delete-btn');
            if (deleteBtn) {
                event.stopPropagation();
                removeHistoryEntry(deleteBtn.dataset.id);
                renderHistoryView();
                return;
            }

            const row = event.target.closest('.history-list-item');
            if (row) openEntry(row, event.ctrlKey || event.metaKey || event.shiftKey);
        });

        historyList.addEventListener('keydown', (event) => {
            if (event.key !== 'Enter' || !event.target.classList.contains('history-list-item')) return;
            openEntry(event.target, event.ctrlKey || event.metaKey || event.shiftKey);
        });

        clearAllBtn.addEventListener('click', () => confirmModal.showModal());
        confirmModalCancel.addEventListener('click', () => confirmModal.close());

        confirmModalDelete.addEventListener('click', () => {
            clearSearchHistory();
            renderHistoryView();
            confirmModal.close();
        });

        confirmModal.addEventListener('click', (event) => {
            if (event.target === confirmModal) confirmModal.close();
        });

        window.addEventListener('storage', (event) => {
            if (event.key === null || event.key === HISTORY_STORAGE_KEY) renderHistoryView();
        });

        renderHistoryView();
    </script>
</body>

</html>
